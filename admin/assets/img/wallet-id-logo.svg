  <text x="73" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#64748B" letter-spacing="1.8">CAMPUS DIGITAL WALLET</text>
